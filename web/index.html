<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn any text into a high-resolution QR code PNG." />
    <title>QR code</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='white' d='M0 0h32v32H0z'/%3E%3Cpath fill='black' d='M2 2h12v12H2zm16 0h12v12H18zM2 18h12v12H2zm16 0h4v4h-4zm8 0h4v8h-4zm-8 8h8v4h-8z'/%3E%3Cpath fill='white' d='M5 5h6v6H5zm16 0h6v6h-6zM5 21h6v6H5z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main aria-label="QR code generator">
      <section class="input">
        <label for="text">Text</label>
        <textarea id="text" placeholder="Type or paste anything…" spellcheck="false" autocomplete="off" aria-describedby="status" autofocus></textarea>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <section class="output" aria-label="QR code">
        <p class="label">QR code</p>
        <div class="preview">
          <p id="empty">Your QR code appears here.</p>
          <img id="qr" alt="QR code encoding your text" hidden />
        </div>
        <div id="actions" hidden>
          <a id="download" download="qr-code.png">Download PNG</a>
          <span id="dimensions"></span>
        </div>
      </section>
    </main>
  </body>
</html>
